name: Super Alpha CI/CD Test

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  run-alpha-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pyyaml

      - name: Run Local Server and Execute Harness Test
        env:
          BRAIN_EMAIL: ${{ secrets.BRAIN_EMAIL }}
          BRAIN_PASSWORD: ${{ secrets.BRAIN_PASSWORD }}
          BRAIN_SESSION_TOKEN: ${{ secrets.BRAIN_SESSION_TOKEN }}
        run: |
          python server.py &
          sleep 3
          python harness/client.py

      - name: Upload Simulation Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-simulation-report
          path: simulation_results.csv
